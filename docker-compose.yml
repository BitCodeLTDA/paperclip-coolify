services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperclip}
      # Coolify auto-generates this password via the SERVICE_PASSWORD_64_POSTGRES magic value.
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-paperclip}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperclip} -d ${POSTGRES_DB:-paperclip}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  paperclip:
    image: ghcr.io/lukasparke/paperclip-coolify:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      PAPERCLIP_HOME: "/paperclip"
      HOME: "/paperclip"
      PAPERCLIP_DEPLOYMENT_MODE: ${PAPERCLIP_DEPLOYMENT_MODE:-authenticated}
      PAPERCLIP_DEPLOYMENT_EXPOSURE: ${PAPERCLIP_DEPLOYMENT_EXPOSURE:-public}
      PAPERCLIP_AUTH_BASE_URL_MODE: ${PAPERCLIP_AUTH_BASE_URL_MODE:-explicit}
      # Coolify auto-generates SERVICE_FQDN_PAPERCLIP from the domain assigned to the
      # paperclip service. PAPERCLIP_FQDN can be set to override it.
      PAPERCLIP_FQDN: ${PAPERCLIP_FQDN:-${SERVICE_FQDN_PAPERCLIP}}
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-https://${PAPERCLIP_FQDN:-${SERVICE_FQDN_PAPERCLIP:?PAPERCLIP_FQDN or SERVICE_FQDN_PAPERCLIP must be set to your public hostname}}}
      PAPERCLIP_AUTH_PUBLIC_BASE_URL: ${PAPERCLIP_AUTH_PUBLIC_BASE_URL:-${PAPERCLIP_PUBLIC_URL:-https://${PAPERCLIP_FQDN:-${SERVICE_FQDN_PAPERCLIP:?PAPERCLIP_FQDN or SERVICE_FQDN_PAPERCLIP must be set to your public hostname}}}}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${PAPERCLIP_PUBLIC_URL:-https://${PAPERCLIP_FQDN:-${SERVICE_FQDN_PAPERCLIP:?PAPERCLIP_FQDN or SERVICE_FQDN_PAPERCLIP must be set to your public hostname}}}}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-${PAPERCLIP_PUBLIC_URL:-https://${PAPERCLIP_FQDN:-${SERVICE_FQDN_PAPERCLIP:?PAPERCLIP_FQDN or SERVICE_FQDN_PAPERCLIP must be set to your public hostname}}}}
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES:-${PAPERCLIP_FQDN:-${SERVICE_FQDN_PAPERCLIP:?PAPERCLIP_FQDN or SERVICE_FQDN_PAPERCLIP must be set to your public hostname}}}
      DATABASE_URL: postgres://${POSTGRES_USER:-paperclip}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-paperclip}
      # Coolify auto-generates these secrets via SERVICE_HEX_64_* magic values.
      BETTER_AUTH_SECRET: ${SERVICE_HEX_64_BETTERAUTH}
      PAPERCLIP_AGENT_JWT_SECRET: ${SERVICE_HEX_64_AGENTJWT}

      # Provider API keys are intentionally passed through to Paperclip and child
      # agent processes, including the pi-local adapter running inside this image.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_CODING_CN_API_KEY: ${ZAI_CODING_CN_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_CN_API_KEY: ${MINIMAX_CN_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_RESOURCE_NAME: ${AZURE_OPENAI_RESOURCE_NAME:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
      AZURE_OPENAI_DEPLOYMENT_NAME_MAP: ${AZURE_OPENAI_DEPLOYMENT_NAME_MAP:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_GATEWAY_ID: ${CLOUDFLARE_GATEWAY_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ENDPOINT_URL_BEDROCK_RUNTIME: ${AWS_ENDPOINT_URL_BEDROCK_RUNTIME:-}
    volumes:
      - paperclip-data:/paperclip
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperclip-${COOLIFY_RESOURCE_UUID:-local}.rule=Host(`${PAPERCLIP_FQDN:-${SERVICE_FQDN_PAPERCLIP:?PAPERCLIP_FQDN or SERVICE_FQDN_PAPERCLIP must be set to your public hostname}}`)"
      - "traefik.http.routers.paperclip-${COOLIFY_RESOURCE_UUID:-local}.entrypoints=websecure"
      - "traefik.http.routers.paperclip-${COOLIFY_RESOURCE_UUID:-local}.tls.certresolver=letsencrypt"
      - "traefik.http.services.paperclip-${COOLIFY_RESOURCE_UUID:-local}.loadbalancer.server.port=3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
  paperclip-data:

networks:
  coolify:
    external: true
